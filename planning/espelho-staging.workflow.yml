# Espelha produção -> staging com anonimização (planning/AMBIENTES.md).
# Semanal (segunda 05:00 BRT = 08:00 UTC) + manual pelo botão "Run workflow".
name: espelho-staging
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  espelhar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instala cliente Postgres
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Roda o espelho
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_SYNTH_PASSWORD: ${{ secrets.STAGING_SYNTH_PASSWORD }}
        run: bash scripts/espelho-staging.sh
