[functions.update-parceiro]
verify_jwt = true

[functions.excluir-parceiro]
verify_jwt = true

[functions.gmail-oauth-start]
verify_jwt = true

[functions.cnj-consulta-processo]
verify_jwt = true

[functions.sync-ti-cliente]
verify_jwt = true

[functions.listar-clientes-ti]
verify_jwt = true

[functions.check-legalmail-nome]
verify_jwt = true

[functions.listar-processos-legalmail]
