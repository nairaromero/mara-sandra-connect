project_id = "llugytkdsfsrciavhrfw"

# ia-mcp autentica por Personal Access Token (PAT) proprio, nao por JWT do
# Supabase. Por isso a verificacao de JWT do gateway fica desligada -- a propria
# function valida o token (hash + expiracao/revogacao). Mesmo padrao do
# whatsapp-inbound.

# ---------------------------------------------------------------------------
# AMBIENTE LOCAL (`supabase start`, Docker) — ver planning/AMBIENTES.md.
# Tudo abaixo vale SÓ para a pilha local: deploy de edge function e os projetos
# hospedados não leem estas seções (não usamos `supabase config push`).
# O banco local é preenchido por `bun run local:copiar` (cópia do staging).
#
# Portas no bloco 553xx, e não nas padrão 543xx: outra pilha local do Supabase
# pode estar usando as padrão na mesma máquina.
# ---------------------------------------------------------------------------
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

# O esquema vem da cópia do staging, não de supabase/migrations (as migrations
# do projeto moram em planning/sql-migrations e não recriam o banco do zero).
[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

# E-mails do Auth local não saem da máquina: caem no Mailpit
# (http://127.0.0.1:55324).
[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

# Espelha o Auth do staging (Management API, conferido em 2026-09-15):
# confirmação de e-mail ligada, OTP de 8 dígitos, senha mínima de 6.
[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/**", "http://localhost:8095/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 6

[auth.rate_limit]
email_sent = 2
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 8
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 55383
deno_version = 2

# Logs/analytics locais pesam (Logflare + Vector) e não são usados.
[analytics]
enabled = false

# ---------------------------------------------------------------------------
# verify_jwt de TODAS as functions, declarado aqui e não na linha de comando.
#
# O gateway com verify_jwt=true só exige *algum* JWT — e a chave publicável do
# site é um JWT (papel anon, válido até 2036). Ou seja: isto é higiene e trava
# contra deploy distraído, não autorização. Quem decide quem entra é a
# checagem dentro da função (_shared/auth.ts).
#
# Deploy: `bunx supabase functions deploy <nome> --project-ref <ref>` SEM
# `--no-verify-jwt` — a flag sobrepõe o que está aqui.
# ---------------------------------------------------------------------------

# cron (pg_net não manda JWT); a checagem é a assinatura de sistema
[functions.digest-diario]
verify_jwt = false

# cron (pg_net não manda JWT); assinatura de sistema
[functions.inss-email-processor]
verify_jwt = false

# cron (pg_net não manda JWT); assinatura de sistema
[functions.sync-datajud-movimentacoes]
verify_jwt = false

# gatilho via pg_net e outra function; assinatura de sistema ou sessão
[functions.notify-novo-andamento]
verify_jwt = false

# gatilho via pg_net; assinatura de sistema ou sessão
[functions.notify-novo-comentario]
verify_jwt = false

# gatilho via pg_net; assinatura de sistema ou sessão
[functions.notify-solicitacao-doc]
verify_jwt = false

# hook do Auth, assinado por Standard Webhooks
[functions.send-email-hook]
verify_jwt = false

# redirect do Google (GET, sem JWT); state assinado
[functions.gmail-oauth-callback]
verify_jwt = false

# webhook da Evolution; token próprio
[functions.whatsapp-inbound]
verify_jwt = false

# cliente MCP manda PAT msc_…, não JWT de sessão
[functions.ia-mcp]
verify_jwt = false

# Chamadas pelo front com a sessão da pessoa.

[functions.ia-config]
verify_jwt = true

[functions.ia-assistant]
verify_jwt = true

[functions.ia-analise]
verify_jwt = true

[functions.ia-triagem-andamentos]
verify_jwt = true

[functions.sugerir-proxima-tarefa]
